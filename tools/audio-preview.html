<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalmar ljudprov</title>
<style>body{background:#171b15;color:#e9deca;font:16px system-ui;margin:32px}h1{color:#e4b26e}section{margin:28px 0;max-width:750px}button{background:#272f21;color:inherit;border:1px solid #b79361;padding:16px;margin:4px;min-height:48px;font:inherit}button:disabled{opacity:.4}p{line-height:1.6}#status{color:#e4b26e}</style>
<h1>Kalmar · ljudprov</h1><p>Varje material använder en separat ElevenLabs-inspelning. Hårda smällar påverkas också av fordonets massa och kollisionshastighet.</p>
<button id="enable">Aktivera ljud</button><p id="status">Ljudet är avstängt tills du aktiverar det.</p>
<section><h2>Kollisioner</h2><div id="impacts"></div></section><section><h2>Vapen</h2><div id="weapons"></div></section><section><h2>Radio</h2><p id="track"></p><button id="previous" disabled>Föregående låt</button><button id="next" disabled>Nästa låt</button><button id="radio-toggle" disabled>Pausa musik</button></section>
<script type="module">
import {createAudio} from '../src/audio.js';
// Assets are relative to the game's root, including deployment in a subfolder.
const base=document.createElement('base');base.href='../';document.head.prepend(base);
const audio=await createAudio(),enable=document.getElementById('enable');
for(const [label,material,speed,mass]of [['Lätt plåtstöt','metal',2,1850],['Tung plåtkrasch','metal',16,7500],['Betongvägg','concrete',13,1850],['Träbänk','wood',13,1850],['Glasruta','glass',13,1850]]){
 const b=document.createElement('button');b.textContent=label;b.disabled=true;b.onclick=()=>audio.impact({material,speed,mass});document.getElementById('impacts').append(b);
}
const scrape=document.createElement('button');scrape.textContent='Skrapning · 2 sekunder';scrape.disabled=true;let scrapeTime=0,flameTime=0,ready=false;scrape.onclick=()=>{scrapeTime=2;};document.getElementById('impacts').append(scrape);
for(const [label,name]of [['Raket','rocket'],['Mina','mine'],['Eldkastare · 2 sekunder','flame']]){const b=document.createElement('button');b.textContent=label;b.disabled=true;b.onclick=()=>{if(name==='flame')flameTime=2;else audio.effect(name,.65);};document.getElementById('weapons').append(b);}
enable.onclick=async()=>{await audio.unlock();audio.startEngine();audio.pause(false);ready=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);enable.hidden=true;document.getElementById('status').textContent='Sex nya kollisions- och skrapljud samt tre nya vapenljud är laddade.';};
document.getElementById('next').onclick=()=>audio.nextMusic();document.getElementById('previous').onclick=()=>audio.previousMusic();
document.getElementById('radio-toggle').onclick=()=>{const music=document.getElementById('soundtrack');if(!music)return;if(music.paused)music.play();else music.pause();document.getElementById('radio-toggle').textContent=music.paused?'Spela musik':'Pausa musik';};
document.addEventListener('radio-track',e=>document.getElementById('track').textContent=e.detail.title);
document.getElementById('track').textContent=audio.musicTitle;
setInterval(()=>{if(!ready)return;if(scrapeTime>0){scrapeTime-=.05;audio.scrape(.8);}flameTime=Math.max(0,flameTime-.05);audio.update({x:0,y:0,z:0,speed:0},[],{flame:flameTime>0});},50);
</script></html>
