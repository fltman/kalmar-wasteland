<!doctype html><html lang="en"><meta charset="utf-8"><title>Kalmar arena relay check</title><style>body{background:#171b15;color:#e4d6bc;font:16px monospace;padding:32px}button{padding:16px;font:inherit;background:#e4b26e;border:0}li{padding:10px}.pass{color:#b0d49a}.fail{color:#ff8e6b}</style><h1>Arena · relay checks</h1><p>Uses real WebSocket connections. Temporary rooms close after the check.</p><button id="run">Run relay checks</button><ul id="results"></ul>
<script type="module">
const results=document.getElementById('results'),sockets=[];
const log=(text,pass=true)=>{const li=document.createElement('li');li.textContent=text;li.className=pass?'pass':'fail';results.append(li);};
const wait=async fn=>{const end=performance.now()+2500;while(performance.now()<end){const value=fn();if(value)return value;await new Promise(r=>setTimeout(r,15));}throw Error('Timed out');};
async function join(name,room){const url=new URL('../arena/ws',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(url);sockets.push(ws);const messages=[];ws.onmessage=e=>messages.push(JSON.parse(e.data));await wait(()=>ws.readyState===1);ws.send(JSON.stringify({type:'join',protocol:1,name,room,vehicle:'interceptor'}));const first=await wait(()=>messages.find(m=>m.type==='welcome'||m.type==='error'));return {ws,messages,first};}
document.getElementById('run').onclick=async()=>{
 results.replaceChildren();document.getElementById('run').disabled=true;
 try{
  const room='CHECK-'+Math.random().toString(36).slice(2,8).toUpperCase(),a=await join('A',room),b=await join('B',room),other=await join('ISOLATED',room+'-B');
  if(a.first.type!=='welcome'||b.first.type!=='welcome')throw Error('Join failed');log('PASS · two clients join the same room');
  a.ws.send(JSON.stringify({type:'state',from:'FORGED',data:{pose:{x:1000000,z:1000000},health:-123}}));
  const state=await wait(()=>b.messages.find(m=>m.type==='state'));if(state.from!==a.first.id||state.data.health!==-123||state.data.pose.x!==1000000)throw Error('Relay modified the payload or trusted a forged sender');log('PASS · server seals sender ID and forwards client data unchanged');
  const late=await join('LATE',room);if(late.first.peers.find(p=>p.id===a.first.id)?.state.health!==-123)throw Error('Latest state was not replayed');log('PASS · a late join receives the most recent client state');
  a.ws.send(JSON.stringify({type:'hit',target:b.first.id,amount:17,weapon:'guns'}));await wait(()=>b.messages.find(m=>m.type==='hit'));
  await new Promise(r=>setTimeout(r,100));if(other.messages.some(m=>m.type==='hit'||m.type==='state')||late.messages.some(m=>m.type==='hit'))throw Error('Room or target isolation failed');log('PASS · targeted hits stay with their recipient; rooms remain isolated');
  for(let i=0;i<5;i++)await join('EXTRA'+i,room);const ninth=await join('NINTH',room);if(ninth.first.type!=='error')throw Error('Room exceeded eight players');log('PASS · eight-player room limit');
  a.ws.close();await wait(()=>b.messages.find(m=>m.type==='roster'&&m.host===b.first.id));log('PASS · disconnect removes the player and passes room coordination to the next client');
  log('ALL RELAY CHECKS PASSED');
 }catch(e){log('FAIL · '+e.message,false);}finally{for(const ws of sockets)ws.close();document.getElementById('run').disabled=false;}
};
</script></html>
