# New vhost only; leave the existing presenter-relay site intact.
# Enable this HTTP vhost, then issue its certificate with Certbot's nginx plugin.
server {
    listen 80;
    server_name arena.bjarby.com;

    location = /ws {
        proxy_pass http://127.0.0.1:5221/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / { return 404; }
}
